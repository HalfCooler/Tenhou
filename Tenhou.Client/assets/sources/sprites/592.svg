  <rect x="571.95" y="20" width="0.85" height="390" fill="url(#vBarSub)"/>

  <!-- Four symmetrical meander (雷纹) corner ornaments joined to border bars -->
  <g fill="none" stroke="#686868" stroke-width="1.15" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/>
    <g transform="translate(590, 0) scale(-1, 1)"><path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/></g>
    <g transform="translate(0, 430) scale(1, -1)"><path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/></g>
    <g transform="translate(590, 430) scale(-1, -1)"><path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/></g>
  </g>

  <!-- Crisp 1px outer frame border -->
  <rect x="0.5" y="0.5" width="589" height="429" fill="none" stroke="#424242" stroke-width="1"/>
</svg>
