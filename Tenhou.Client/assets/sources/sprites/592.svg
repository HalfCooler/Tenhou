      <stop offset="0%" stop-color="#bcbcbc" stop-opacity="0.72"/>
      <stop offset="52%" stop-color="#dadada" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
