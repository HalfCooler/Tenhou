  <rect x="0" y="404" width="590" height="26" fill="url(#botVig)"/>
  <rect x="0" y="0" width="26" height="430" fill="url(#leftVig)"/>
  <rect x="564" y="0" width="26" height="430" fill="url(#rightVig)"/>

  <!-- Edge-center white fade -->
  <rect x="0" y="1" width="590" height="28" fill="url(#hFade)"/>
  <rect x="0" y="401" width="590" height="28" fill="url(#hFade)"/>
  <rect x="1" y="0" width="28" height="430" fill="url(#vFade)"/>
  <rect x="561" y="0" width="28" height="430" fill="url(#vFade)"/>

  <!-- Connected double inner border bars (filled rects with userSpaceOnUse gradients) -->
  <rect x="24" y="14.0" width="542" height="1.15" fill="url(#hBarMain)"/>
  <rect x="24" y="17.2" width="542" height="0.85" fill="url(#hBarSub)"/>
  <rect x="24" y="414.85" width="542" height="1.15" fill="url(#hBarMain)"/>
  <rect x="24" y="411.95" width="542" height="0.85" fill="url(#hBarSub)"/>

  <rect x="14.0" y="20" width="1.15" height="390" fill="url(#vBarMain)"/>
  <rect x="17.2" y="20" width="0.85" height="390" fill="url(#vBarSub)"/>
