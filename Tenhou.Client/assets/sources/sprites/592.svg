      <stop offset="38%" stop-color="#b4b4b4" stop-opacity="0"/>
      <stop offset="62%" stop-color="#b4b4b4" stop-opacity="0"/>
      <stop offset="76%" stop-color="#848484" stop-opacity="0.72"/>
