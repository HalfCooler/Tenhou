      <stop offset="22%" stop-color="#848484" stop-opacity="0.72"/>
      <stop offset="36%" stop-color="#b4b4b4" stop-opacity="0"/>
      <stop offset="64%" stop-color="#b4b4b4" stop-opacity="0"/>
