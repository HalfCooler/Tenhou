  <rect x="0" y="301" width="728" height="28" fill="url(#hFade)"/>
  <rect x="1" y="0" width="28" height="330" fill="url(#vFade)"/>
  <rect x="699" y="0" width="28" height="330" fill="url(#vFade)"/>

