  <g fill="none" stroke="#686868" stroke-width="1.15" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/>
    <g transform="translate(728, 0) scale(-1, 1)"><path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/></g>
    <g transform="translate(0, 330) scale(1, -1)"><path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/></g>
    <g transform="translate(728, 330) scale(-1, -1)"><path d="M 14.5 20.5 L 14.5 17.5 L 11.5 17.5 L 11.5 8.5 L 24.5 8.5 L 24.5 14.5 M 24.5 14.5 L 21.5 14.5 L 21.5 11.5 L 14.5 11.5 L 14.5 14.5 L 17.5 14.5 L 17.5 17.5 L 21.5 17.5 L 21.5 20.5 L 14.5 20.5"/></g>
